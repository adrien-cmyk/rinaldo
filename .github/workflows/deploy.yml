name: Deploy (FTP → Infomaniak)

on:
  push:
    branches: [ main ]          # push => déploie DEV automatiquement
  workflow_dispatch:            # bouton "Run workflow" => choix dev ou production
    inputs:
      environment:
        description: "Cible du déploiement"
        type: choice
        options: [ dev, production ]
        default: dev

concurrency:
  group: ftp-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  # ---------- DEV : auto sur push, ou dispatch "dev" ----------
  deploy-dev:
    if: github.event_name == 'push' || github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to DEV (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.htaccess
            **/.user.ini
            **/.infomaniak-maintenance.html
            **/README.md
            **/.nojekyll
            **/content/**
            content-path.php

  # ---------- PROD : uniquement dispatch manuel "production" ----------
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to PRODUCTION (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./sites/rinaldomarasco.art/   # fixé ici : jamais la racine FTP
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.htaccess
            **/.user.ini
            **/.infomaniak-maintenance.html
            **/README.md
            **/.nojekyll
            **/content/**
            content-path.php
      # Une page index.html laissée par l'hébergeur passerait devant index.php : on la retire
      - name: Remove default index.html (if any)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y lftp >/dev/null
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-force true; set ssl:verify-certificate no; cd sites/rinaldomarasco.art; ls; rm -f index.html; rm -f index.htm; bye" || true
